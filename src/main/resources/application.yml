spring:
    application:
        name: stock_project  # 첫 줄을 이렇게 안으로 넣어야 합니다.

    # MySQL 설정
    datasource:
        url: jdbc:mysql://localhost:3306/local_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
        username: local_user
        password: local_password
        driver-class-name: com.mysql.cj.jdbc.Driver

    # JPA 설정
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    # Redis 설정
    data:
        redis:
            host: localhost
            port: 6379

    # Elasticsearch 설정
    elasticsearch:
        uris: http://localhost:9200